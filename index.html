<body><h1>Find My Tracker</h1>
<p>Find My Tracker is a private, single-user macOS menu-bar app. It reads item locations from the owner's own Find My app on the owner's Mac and writes them to one Google Sheet in the owner's own Google Drive.</p>
<p>It is not offered to the public and has no other users.</p>
